<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismaili Family Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
        <h1 class="text-2xl font-bold text-teal-800 mb-1">Ismaili Family Foundation</h1>
        <h2 class="text-xl font-semibold text-teal-600 mb-2">اسماعیلی فیملی فاؤنڈیشن</h2>
        <p class="text-gray-500 text-sm mb-6">Private Family Support Platform</p>

        <form action="dashboard.html" method="GET" class="space-y-4 text-right">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Email / Username</label>
                <input type="email" value="as9141388@gmail.com" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Password</label>
                <input type="password" placeholder="پاسورڈ درج کریں" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>

            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 color-white text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                Secure Family Access
            </button>
        </form>

        <p class="text-xs text-gray-400 mt-6">This is a private family-only platform. Unauthorized access is prohibited.</p>
    </div>

</body>
</html>
